<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Moto Rally</title>
  <link rel="stylesheet" href="./styles.css?v=20260620">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Australian motorcycle events</p>
      <h1>Moto Rally</h1>
    </div>
    <div class="status" id="status">Loading events...</div>
  </header>

  <main>
    <section class="controls" aria-label="Filters">
      <label>
        <span>Search</span>
        <input id="searchInput" type="search" placeholder="Event, place, source">
      </label>
      <label>
        <span>State</span>
        <select id="stateFilter"></select>
      </label>
      <label>
        <span>Category</span>
        <select id="categoryFilter"></select>
      </label>
      <label>
        <span>Source</span>
        <select id="sourceFilter"></select>
      </label>
      <button id="clearFilters" type="button">Clear</button>
    </section>

    <section class="summary" aria-live="polite">
      <strong id="resultCount">0 events</strong>
      <span id="lastUpdated"></span>
    </section>

    <section id="eventsList" class="events" aria-label="Events"></section>

    <section id="emptyState" class="empty" hidden>
      <h2>No events match those filters</h2>
      <p>Try clearing filters or searching a broader term.</p>
    </section>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
        .then(() => 'caches' in window ? caches.keys() : [])
        .then((keys) => Promise.all((keys || []).map((key) => caches.delete(key))))
        .catch(() => {});
    }
  </script>
  <script src="./app.js?v=20260620" defer></script>
</body>
</html>
